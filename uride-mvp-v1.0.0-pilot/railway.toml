[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate --schema=services/api/prisma/schema.prisma && npm run build:api"

[deploy]
preDeployCommand = "npx prisma db push --schema=services/api/prisma/schema.prisma"
startCommand = "node services/api/dist/main.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
